spring.application.name=event-booking

# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventbooking}
spring.datasource.username=${DB_USERNAME:eventuser}
spring.datasource.password=${DB_PASSWORD:eventpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# server
server.port=${SERVER_PORT:8080}

# actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always