services:

  postgres:
    image: postgres:16
    container_name: event-booking-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: event-booking:${APP_VERSION:-local}

    container_name: event-booking-app

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_PORT: 8080

      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}

      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-always}

    ports:
      - "${SERVER_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  prometheus:
    image: prom/prometheus

    container_name: event-booking-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml


  grafana:
    image: grafana/grafana

    container_name: event-booking-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus


volumes:

  postgres_data: