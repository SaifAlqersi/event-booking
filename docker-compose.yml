services:

  postgres:
    image: postgres:16
    container_name: event-booking-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-eventbooking}
      POSTGRES_USER: ${DB_USERNAME:-eventuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpass}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-eventuser} -d ${DB_NAME:-eventbooking}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  app:
    image: event-booking:latest

    container_name: event-booking-app

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eventbooking}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-eventuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-eventpass}

      SERVER_PORT: 8080

      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

    ports:
      - "${SERVER_PORT:-8080}:8080"


    depends_on:
      postgres:
        condition: service_healthy


    restart: unless-stopped



volumes:

  postgres_data: